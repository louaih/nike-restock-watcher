name: Watch stock

on:
  schedule:
    - cron: "*/5 * * * *"  # GitHub's minimum; runs are best-effort and often delayed
  workflow_dispatch:
    inputs:
      test_email:
        description: Send a test email instead of checking stock
        type: boolean
        default: false

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Caches are immutable, so each run saves under a new key and restores the newest one.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Check stock
        env:
          STYLE_COLOR: IO7254-133
          PRODUCT_URL: https://www.nike.com/t/new-york-knicks-mens-standard-issue-basketball-jacket-OIc02ibp/IO7254-133
          SIZES: ${{ vars.SIZES }}
          STATE_FILE: state.json
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 watcher.py ${{ inputs.test_email && '--test-email' || '--once' }}

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
